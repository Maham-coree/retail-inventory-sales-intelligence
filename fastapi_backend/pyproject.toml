[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "logs", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the configured local PostgreSQL database"]
