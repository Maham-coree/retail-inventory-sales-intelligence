[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-inventory-sales-intelligence"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "python-dotenv",
    "alembic",
    "bcrypt",
    "PyJWT",
    "python-multipart",
    "pydantic>=2",
    "httpx",
]

[tool.setuptools]
py-modules = ["index"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*", "chatbot/*.json"]

[tool.vercel]
entrypoint = "index:app"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "logs", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the configured local PostgreSQL database"]
